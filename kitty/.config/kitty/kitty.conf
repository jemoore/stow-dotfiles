# vim:ft=kitty:foldmethod=marker
#
# Opinionated kitty config. Works on macOS and Linux (macos_* options are
# silently ignored on Linux, so this file is safe to share across both).
# Reload after editing with cmd+shift+, (see keymaps below).

#: Fonts {{{

# Menlo ships with macOS, so this works out of the box. To upgrade to a
# programming font with ligatures + prompt glyphs, install a Nerd Font, e.g.
#   brew install --cask font-jetbrains-mono-nerd-font
# then swap the line below to: font_family family="JetBrainsMono Nerd Font"
# (or run `kitten choose-fonts` for a live picker).
# font_family      family="Menlo"
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        14.0

# Ligatures on, except under the cursor so you can see the real characters.
# (No effect with Menlo, which has none — kept for when you switch fonts.)
disable_ligatures cursor

#: }}}

#: Cursor {{{

cursor_shape          block
cursor_blink_interval 1
cursor_trail          0

#: }}}

#: Scrollback {{{

scrollback_lines              10000
scrollback_pager_history_size 10

#: }}}

#: Mouse & URLs {{{

url_style             curly
detect_urls           yes
copy_on_select        yes
strip_trailing_spaces smart
mouse_hide_wait       3.0

#: }}}

#: Window, tabs & layout {{{

enabled_layouts     splits,stack
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{index}: {title}"

background_opacity      1.0
# background_blur        20        # macOS-only frosted-glass effect
window_padding_width    4
# hide_window_decorations titlebar-only

#: }}}

#: macOS-specific {{{

macos_option_as_alt                yes
macos_quit_when_last_window_closed yes
confirm_os_window_close            0

#: }}}

#: Keymaps {{{

# Splits (panes), inheriting the current directory.
map cmd+d        launch --location=vsplit --cwd=current
map cmd+shift+d  launch --location=hsplit --cwd=current
map cmd+opt+left  neighboring_window left
map cmd+opt+right neighboring_window right
map cmd+opt+up    neighboring_window up
map cmd+opt+down  neighboring_window down

# New tab / window inherit the current directory.
map cmd+t     new_tab_with_cwd
map cmd+enter new_window_with_cwd

# Jump straight to a tab by number.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Font size.
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0

# Scrollback in your pager, and live config reload.
map cmd+shift+h show_scrollback
map cmd+shift+comma load_config_file

#: }}}

#: Misc {{{

allow_remote_control yes

# Theme: manage interactively with `kitten themes`.
include current-theme.conf

#: }}}


# BEGIN_KITTY_FONTS
font_family      family="ShureTechMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
